name: Tests and container validation

on:
  pull_request:
  push:
    branches: ['version-*']
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ERFASSUNG_DISABLE_SCHEDULER: '1'
      ERFASSUNG_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest -q --junitxml=test-results/python.xml
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
      - run: docker build -t erfassung:test .
      - name: Container health and restart
        run: |
          set -euo pipefail
          docker run -d --name erfassung-test --network none erfassung:test
          trap 'docker logs erfassung-test; docker rm -f erfassung-test' EXIT
          for pass in 1 2; do
            healthy=0
            for attempt in $(seq 1 30); do
              if docker exec erfassung-test python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3))['status']=='ok'"; then
                healthy=1
                break
              fi
              sleep 1
            done
            test "$healthy" = 1
            if [ "$pass" = 1 ]; then docker restart erfassung-test; fi
          done
