name: Tests and container validation

on:
  pull_request:
  # Every PR update is checked here; publication calls the same complete suite.
  # A second branch-push run would cancel its identical PR run (or vice versa).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ERFASSUNG_DISABLE_SCHEDULER: '1'
      ERFASSUNG_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest -q --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-results
          path: test-results/

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      ERFASSUNG_DISABLE_SCHEDULER: '1'
      ERFASSUNG_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/

  container:
    name: Container build and restart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t erfassung:test .
      - name: Container health and restart
        run: |
          set -euo pipefail
          docker run -d --name erfassung-test --network none erfassung:test
          trap 'docker logs erfassung-test; docker rm -f erfassung-test' EXIT
          for pass in 1 2; do
            healthy=0
            for attempt in $(seq 1 30); do
              if docker exec erfassung-test python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3))['status']=='ok'"; then
                healthy=1
                break
              fi
              sleep 1
            done
            test "$healthy" = 1
            if [ "$pass" = 1 ]; then docker restart erfassung-test; fi
          done

  # Keep the original check name for existing branch protection rules.
  tests:
    needs: [python, javascript, browser, container]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = {name: job['result'] for name, job in json.loads(os.environ['CHECK_RESULTS']).items()}
          print(results)
          assert all(result == 'success' for result in results.values()), results
          PY
